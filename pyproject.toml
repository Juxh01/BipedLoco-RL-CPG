# For TOML reference
# https://learnxinyminutes.com/docs/toml/

[project]
name = "BipedLoco-RL-CPG"
version = "1.0.0"
description = "Empirical Evaluation of Biped Locomotion with Central Pattern Generators and Reinforcement Learning"
authors = [{ name = "Maximilian Arling", email = "maximilian.arling@stud.uni-hannover.de" }, { name = "Julius Heidmann", email = "julius.heidmann@stud.uni-hannover.de" }]
readme = "README.md"
requires-python = "~=3.11.0"
keywords = [
    "Reinforcement Learning",
    "Central Pattern Generators",
    "Biped Locomotion",
    "Neuroinspired Control",
]


dependencies = [
    "numpy",
    "torch",
    "tqdm",
    "matplotlib",
    "rich",
    "jupyterlab",
    "tensorboard",
    "hydra-core",
    "hydra-joblib-launcher",
    "hydra-colorlog",
    "hydra-optuna-sweeper",
    "omegaconf",
    "rliable",
    "hypersweeper",
    "optuna",
    "cmaes",
    "setuptools<81",
    "pytest>=8.4.1",
    "gymnasium",
    "stable-baselines3",
    "scipy",
    "mujoco >= 2.3.6",
    "myosuite",
    "deprl",
    "h5py>=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=4.6",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",
    "ruff",
    "pre-commit",
    "isort"]

# Extra sets for different deployment targets
desktop = ["opencv-python"]
ucloud = ["opencv-python-headless==4.10.0.84"]

[tool.setuptools]
packages = ["source", "rl_train", "myoassist_utils", "ctrl_optim"]

[tool.setuptools.package-dir]
source = "source"
rl_train = "source/environments/myoassist/rl_train"
myoassist_utils = "source/environments/myoassist/myoassist_utils"
ctrl_optim = "source/environments/myoassist/ctrl_optim"

[tool.isort]
py_version = "38"
profile = "black" # Play nicely with black
src_paths = ["configs", "source", "tests"]
known_types = ["typing", "abc"] # We put these in their own section "types"
known_test = ["tests"]
sections = [
    "FUTURE",
    "TYPES",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "TEST",
    "LOCALFOLDER",
] # section ordering
multi_line_output = 3 # https://pycqa.github.io/isort/docs/configuration/multi_line_output_modes.html
skip = ["source/environments/myoassist/"]

[tool.pydocstyle]
convention = "numpy"
add-ignore = [# http://www.pydocstyle.org/en/stable/error_codes.html
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary and description
    "D210", # No whitespaces allowed surrounding docstring text
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D400", # First line should end with a period
    "D401", # First line should be in imperative mood
    "D404", # First word of docstring should not be this
    "D413", # Missing blank line after last section
    "D415", # First line should end with a period, question mark, or exclamation point
]

[tool.ruff]
extend-exclude = ["source/environments/myoassist/"]

[tool.ruff.lint]
ignore = [
    # Conflicts with the formatter
    "COM812", "ISC001"
]
